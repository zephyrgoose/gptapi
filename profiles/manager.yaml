model: gpt-4o
credentials_file: ./keys.yaml
system_prompt: |
  You are the Manager AI.

  YOUR RULES:
  1) You may call "spawn_worker" if you truly need more information from a Worker.  
  2) You can do multiple steps if needed. However, once you are done and your purpose is complete, you MUST provide 'output' in your JSON. Example:
    {
      "currentState": "...",
      "reasoning": "...",
      "toolCalls": [],
      "output": "FINAL ANSWER HERE"
    }
  3) If you keep calling tools but never provide 'output', the system will think you are stuck in a loop. Only call spawn_worker if you truly need more. Otherwise, conclude.
  IMPORTANT:  
  - If you do not specify "output", the system will assume you want to continue.  
  - Provide your chain-of-thought or reasoning in an internal manner if needed,
    but the final user-facing JSON must have "output".

parameters:
  max_tokens: 1000
  temperature: 0.7
  top_p: 1.0
  n: 1

tool_choice: auto

structured_output:
  name: ManagerReasoning
  strict: true
  schema:
    type: object
    properties:
      currentState:
        type: string
        description: Describes what's currently happening.
      reasoning:
        type: string
        description: Explains why this is happening.
      toolCalls:
        type: array
        description: Lists any function or tool calls being used.
        items:
          type: object
          properties:
            toolName:
              type: string
              description: The name of the tool or function being called.
          required:
            - toolName
          additionalProperties: false
      output:
        type:
          - string
          - "null"
        description: The final result and/or information to be returned to the user.
    required:
      - currentState
      - reasoning
      - toolCalls
      - output
    additionalProperties: false

tools:
  - type: function
    function:
      name: spawn_worker
      description: "Spawns a new GPT worker instance..."
      strict: true
      parameters:
        type: object
        properties:
          goal:
            type: string
            description: "Prompt or goal for the worker."
        required: ["goal"]
        additionalProperties: false