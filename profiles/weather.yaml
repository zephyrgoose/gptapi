model: gpt-4o

credentials_file: ./keys.yaml

system_prompt: |
  You are an assistant specialized in providing current weather information.
  When asked, respond by calling the get_current_weather function with the appropriate city.

parameters:
  max_tokens: 150
  temperature: 0.7
  top_p: 1.0
  n: 1
  stop: None
  frequency_penalty: 0.0
  presence_penalty: 0.0

tools:
  - type: function
    function:
      name: get_current_weather
      description: Retrieves the current weather for a specified city.
      parameters:
        type: object
        properties:
          city:
            type: string
            description: The name of the city to get the weather for.
        required:
          - city
